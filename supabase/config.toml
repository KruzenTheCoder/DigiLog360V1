# DigiLog 360 — Supabase configuration.
# `project_id` is set automatically when you run `supabase link --project-ref <ref>`.
project_id = "digilog360"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Set to your deployed admin URL in production.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "digilog360://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = true
policy = "oneshot"
